<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnionQuant · 研报面板</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
  --text: #e1e4ea; --muted: #8b8fa3; --green: #10b981;
  --red: #ef4444; --yellow: #f59e0b; --blue: #3b82f6;
  --purple: #8b5cf6; --orange: #f97316;
}
[data-theme="light"] {
  --bg: #f8f9fb; --surface: #fff; --border: #e2e5ec;
  --text: #1a1d2d; --muted: #6b7094;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 4px; }
h2 { font-size: 1.15rem; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.status-bar { font-size: 0.8rem; color: var(--muted); display: flex; gap: 16px; align-items: center; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; display: inline-block; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.priority-badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
.p0 { background: var(--red); color: #fff; }
.p1 { background: var(--orange); color: #fff; }
.p2 { background: var(--muted); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.card.priority { border-left: 3px solid var(--red); }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; }
.up { color: var(--green); }
.down { color: var(--red); }
.risk-tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; margin-right: 4px; display: inline-block; margin-bottom: 4px; }
.risk-critical { background: rgba(239,68,68,0.15); color: var(--red); }
.risk-warning { background: rgba(245,158,11,0.12); color: var(--yellow); }
.risk-info { background: rgba(59,130,246,0.12); color: var(--blue); }
.chart-mini { width: 100%; height: 60px; margin-top: 8px; }
.verdict-box { padding: 10px 14px; border-radius: 6px; margin-top: 8px; font-weight: 600; font-size: 0.9rem; }
.verdict-bull { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.verdict-bear { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.verdict-neutral { background: rgba(139,143,163,0.1); color: var(--muted); border: 1px solid rgba(139,143,163,0.3); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 20px; text-align: center; }
.news-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
.news-item:last-child { border-bottom: none; }
.news-time { color: var(--muted); font-size: 0.78rem; }
.refresh-btn { font-size: 0.78rem; padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; }
.refresh-btn:hover { border-color: var(--blue); }

/* ── LangGraph Progress Styles ── */
.dept-progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.82rem;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.dept-progress-card .dept-header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
}
.dept-progress-card .dept-icon {
  width: 20px; height: 20px; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
}
.dept-progress-card .dept-name {
  font-weight: 600; flex: 1;
}
.dept-progress-card .dept-score {
  font-size: 0.75rem; color: var(--muted);
}
.dept-progress-card .dept-summary {
  font-size: 0.75rem; color: var(--muted);
  margin-top: 4px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.dept-progress-card .dept-error {
  font-size: 0.72rem; color: var(--red);
  margin-top: 4px;
}
.dept-progress-card.status-pending { opacity: 0.5; }
.dept-progress-card.status-running {
  border-color: var(--blue);
  box-shadow: 0 0 8px rgba(59,130,246,0.15);
}
.dept-progress-card.status-complete { border-color: var(--green); }
.dept-progress-card.status-error { border-color: var(--red); }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top: 2px solid var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }

.research-form {
  display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
}
.research-form input {
  flex: 1; min-width: 140px;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 0.88rem;
}
.research-form input:focus { outline: none; border-color: var(--blue); }
.run-btn {
  padding: 8px 18px; border: none; border-radius: 6px;
  background: var(--blue); color: #fff; font-size: 0.88rem;
  font-weight: 600; cursor: pointer; transition: background 0.2s;
}
.run-btn:hover { background: #2563eb; }
.run-btn:disabled { background: var(--muted); cursor: not-allowed; }
.run-btn.running { background: var(--red); }

#pipelineTimer { color: var(--muted); font-size: 0.8rem; margin-left: 8px; }
#finalReport { margin-top: 20px; }
#finalReport .report-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; font-size: 0.88rem;
  line-height: 1.7; white-space: pre-wrap; max-height: 600px;
  overflow-y: auto;
}
#finalReport table { margin: 8px 0; }
#finalReport table td { padding: 3px 8px; }

@media (max-width: 768px) {
  .card-grid { grid-template-columns: 1fr; }
  .research-form { flex-direction: column; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🧅 OnionQuant · 研报面板</h1>
    <div class="status-bar">
      <span class="live-dot"></span> 实时追踪中 ·
      <span id="updateTime">--</span> ·
      自动刷新 <span id="countdown">60s</span>
    </div>
  </div>
  <button class="refresh-btn" onclick="refreshAll()">↻ 刷新</button>
</div>

<!-- 🔬 LangGraph 11部门联动研究 -->
<h2>🔬 LangGraph 多Agent联动研究 <span style="color:var(--muted);font-size:0.75rem;font-weight:400;">SSE实时推送</span></h2>
<div class="card" id="researchTrigger">
  <p style="font-size:0.82rem;color:var(--muted);margin-bottom:6px;">
    输入标的代码和分析问题，启动全部 11 个部门的自动化研究管道。进度实时推送。
  </p>
  <div class="research-form">
    <input id="tickerInput" placeholder="标的代码 (如: NVDA,MU,DXYZ)" value="NVDA,MU">
    <input id="queryInput" placeholder="研究问题 (如: 分析目标价和催化剂)">
    <button id="runBtn" class="run-btn" onclick="startResearch()">▶ 启动分析</button>
  </div>
</div>

<!-- 📡 部门分析进度 -->
<h2>📡 部门分析进度 <span id="progressSummary" style="color:var(--muted);font-size:0.78rem;font-weight:400;"></span> <span id="pipelineTimer"></span></h2>
<div id="progressPanel" class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
  <div class="empty" style="grid-column:1/-1;">点击「启动分析」开始 LangGraph 研究管道...</div>
</div>

<!-- 📋 最终研报 -->
<div id="finalReport" style="display:none;">
  <h2>📋 最终研报 <span id="finalConfidence" style="color:var(--muted);font-size:0.8rem;font-weight:400;"></span></h2>
  <div id="finalReportContent" class="report-content"></div>
</div>

<!-- 🔴 DXYZ 专区 (P0 — 董事长全仓) -->
<h2><span class="priority-badge p0">P0</span> DXYZ · Destiny Tech100 <span style="color:var(--green);font-size:0.9rem;">全仓跟踪</span></h2>
<div id="dxyzSection"></div>

<!-- 🟡 SK Hynix 追踪 (P1 — 董事长关注) -->
<h2><span class="priority-badge p1">P1</span> 海力士 (000660.KR) · SK Hynix <span style="color:var(--muted);font-size:0.8rem;">HBM龙头</span></h2>
<div id="hynixSection"></div>

<!-- 🟢 存储/半导体/航天/光模块 概览 -->
<h2>📊 研报关注标的概览</h2>
<div id="overviewSection"></div>

<!-- 📚 研报历史 -->
<h2>📚 研报历史 <span style="color:var(--muted);font-size:0.75rem;font-weight:400;">LangGraph 自动存档</span></h2>
<div id="historySection"><div class="empty">加载中...</div></div>

<!-- 📰 核心事件时间线 -->
<h2>📅 催化剂日历</h2>
<div id="catalystSection"></div>

<script>
// ─── Department definitions (matches full_research_graph.py DEPT_NAMES) ───
const DEPTS = [
  { key: "data_engineering",    name: "数据工程部",       icon: "📡" },
  { key: "strategy_research",   name: "策略研究部",       icon: "🎯" },
  { key: "risk_management",     name: "风险管理部",       icon: "🛡️" },
  { key: "sentiment_intel",     name: "舆情情报部",       icon: "📰" },
  { key: "backtest_engine",     name: "回测引擎部",       icon: "⚙️" },
  { key: "knowledge_management",name: "知识管理部",       icon: "🧠" },
  { key: "academic_research",   name: "学术研究部",       icon: "📚" },
  { key: "extreme_drive",       name: "极限驱动部",       icon: "🚀" },
  { key: "reporting",           name: "报告部",           icon: "📝" },
  { key: "ceo_office",          name: "CEO办公室",        icon: "🏢" },
  { key: "chairman_secretariat",name: "董事长秘书处",     icon: "📋" },
];

const REFRESH_INTERVAL = 60000;
let countdown = 60;
let researchStream = null;
let pipelineStartTime = null;
let pipelineTimerInterval = null;

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

// ─── LangGraph Research Pipeline ───

function initProgressPanel() {
  const panel = document.getElementById('progressPanel');
  panel.innerHTML = DEPTS.map(d => `
    <div class="dept-progress-card status-pending" id="dept-${d.key}">
      <div class="dept-header">
        <span class="dept-icon">${d.icon}</span>
        <span class="dept-name">${d.name}</span>
        <span class="dept-score" id="score-${d.key}"></span>
      </div>
      <div class="dept-summary" id="summary-${d.key}"></div>
      <div class="dept-error" id="error-${d.key}" style="display:none;"></div>
    </div>
  `).join('');
  document.getElementById('progressSummary').textContent = '0/11';
  document.getElementById('pipelineTimer').textContent = '';
  document.getElementById('finalReport').style.display = 'none';
}

function setDeptStatus(deptKey, status, opts = {}) {
  const card = document.getElementById('dept-' + deptKey);
  if (!card) return;
  card.className = 'dept-progress-card status-' + status;

  // Show spinner on running
  const iconEl = card.querySelector('.dept-icon');
  if (iconEl && status === 'running') {
    iconEl.innerHTML = '<span class="spinner"></span>';
  } else if (iconEl && DEPTS.find(d => d.key === deptKey)) {
    iconEl.textContent = DEPTS.find(d => d.key === deptKey).icon;
  }

  if (opts.score != null) {
    const color = opts.score >= 8 ? 'var(--green)' : opts.score >= 6 ? 'var(--yellow)' : 'var(--orange)';
    document.getElementById('score-' + deptKey).innerHTML =
      '置信度: <strong style="color:' + color + '">' + opts.score.toFixed(1) + '/10</strong>';
  }
  if (opts.summary) {
    document.getElementById('summary-' + deptKey).textContent = opts.summary;
  }
  if (opts.errorMsg) {
    const errEl = document.getElementById('error-' + deptKey);
    errEl.textContent = '❌ ' + opts.errorMsg;
    errEl.style.display = 'block';
  }
  if (opts.extra) {
    document.getElementById('summary-' + deptKey).textContent = opts.extra;
  }
}

function updateProgressCount() {
  const done = document.querySelectorAll('.dept-progress-card.status-complete').length;
  const errors = document.querySelectorAll('.dept-progress-card.status-error').length;
  document.getElementById('progressSummary').textContent = done + '/11' + (errors ? ' (' + errors + ' 失败)' : '');
}

function startPipelineTimer() {
  pipelineStartTime = Date.now();
  if (pipelineTimerInterval) clearInterval(pipelineTimerInterval);
  pipelineTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - pipelineStartTime) / 1000);
    document.getElementById('pipelineTimer').textContent =
      '⏱ ' + Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's';
  }, 1000);
}

function stopPipelineTimer() {
  if (pipelineTimerInterval) { clearInterval(pipelineTimerInterval); pipelineTimerInterval = null; }
}

function startResearch() {
  const tickers = document.getElementById('tickerInput').value.trim();
  const query = document.getElementById('queryInput').value.trim();
  if (!tickers) return;

  // Close existing stream
  if (researchStream) { researchStream.close(); researchStream = null; }

  const btn = document.getElementById('runBtn');
  btn.textContent = '⏹ 停止';
  btn.className = 'run-btn running';
  btn.onclick = stopResearch;

  initProgressPanel();
  startPipelineTimer();
  document.getElementById('finalReport').style.display = 'none';

  const params = new URLSearchParams({ tickers: tickers });
  if (query) params.set('query', query);

  researchStream = new EventSource('/api/research/stream?' + params.toString());

  researchStream.addEventListener('progress', function(e) {
    try {
      const d = JSON.parse(e.data);
      if (d.event === 'start') {
        setDeptStatus(d.dept_key, 'running');
      } else if (d.event === 'complete') {
        const extra = (d.tickers_loaded != null)
          ? '加载 ' + d.tickers_loaded + ' 标的, ' + (d.risk_tickers || 0) + ' 风险指标'
          : (d.summary || '');
        setDeptStatus(d.dept_key, 'complete', {
          score: d.score,
          summary: extra
        });
        updateProgressCount();
      } else if (d.event === 'error') {
        setDeptStatus(d.dept_key, 'error', {
          score: d.score,
          summary: d.summary || '',
          errorMsg: d.error || '未知错误'
        });
        updateProgressCount();
      }
    } catch (_) {}
  });

  researchStream.addEventListener('done', function(e) {
    try {
      const d = JSON.parse(e.data);
      stopPipelineTimer();
      resetRunBtn();

      // Show final report
      const reportDiv = document.getElementById('finalReport');
      reportDiv.style.display = 'block';
      document.getElementById('finalReportContent').innerHTML =
        escHtml(d.final_report || '报告生成完成') ;

      // Show aggregate confidence
      if (d.confidence_scores && Object.keys(d.confidence_scores).length > 0) {
        const deptEntries = Object.entries(d.confidence_scores);
        const avgScore = deptEntries.reduce((s, [,v]) => s + v, 0) / deptEntries.length;
        document.getElementById('finalConfidence').textContent =
          '综合置信度: ' + avgScore.toFixed(1) + '/10 (' + deptEntries.length + '部门)';
      }

      // Show step summary
      if (d.steps_completed) {
        const summaryEl = document.getElementById('progressSummary');
        summaryEl.textContent = d.steps_completed.length + '/11 完成';
        if (d.errors && d.errors.length) {
          summaryEl.textContent += ' (' + d.errors.length + ' 错误)';
        }
      }

      if (researchStream) { researchStream.close(); researchStream = null; }
      loadHistory();  // Refresh history list after new report saved
    } catch (_) {}
  });

  researchStream.addEventListener('error', function(e) {
    // May be a pipeline error event or connection error
    try {
      if (e.data) {
        const d = JSON.parse(e.data);
        document.getElementById('finalReport').style.display = 'block';
        document.getElementById('finalReportContent').innerHTML =
          '<span style="color:var(--red);">管道错误: ' + escHtml(d.message || '未知错误') + '</span>';
        document.getElementById('finalConfidence').textContent = '';
      }
    } catch (_) {}
    stopPipelineTimer();
    resetRunBtn();
    if (researchStream) { researchStream.close(); researchStream = null; }
  });

  // Heartbeat — keep connection alive
  researchStream.addEventListener('heartbeat', function() {});

  researchStream.onerror = function() {
    // Connection-level error (network)
    stopPipelineTimer();
    resetRunBtn();
    if (researchStream) { researchStream.close(); researchStream = null; }
  };
}

function stopResearch() {
  if (researchStream) { researchStream.close(); researchStream = null; }
  stopPipelineTimer();
  resetRunBtn();
}

function resetRunBtn() {
  const btn = document.getElementById('runBtn');
  btn.textContent = '▶ 启动分析';
  btn.className = 'run-btn';
  btn.onclick = startResearch;
}

// ─── Report History ───

async function loadHistory() {
  const el = document.getElementById('historySection');
  try {
    const r = await fetch('/api/research/history?limit=10');
    const data = await r.json();
    const reports = data.reports || [];
    if (!reports.length) {
      el.innerHTML = '<div class="empty">暂无历史研报，运行一次 LangGraph 分析后自动存档</div>';
      return;
    }
    el.innerHTML = reports.map(rep => {
      const ts = rep.timestamp ? new Date(rep.timestamp).toLocaleString() : '';
      const tickers = (rep.tickers || []).join(', ');
      const avgScore = rep.confidence_scores && Object.keys(rep.confidence_scores).length
        ? (Object.values(rep.confidence_scores).reduce((s, v) => s + v, 0) / Object.keys(rep.confidence_scores).length).toFixed(1)
        : '—';
      const scoreColor = avgScore >= 8 ? 'var(--green)' : avgScore >= 6 ? 'var(--yellow)' : 'var(--muted)';
      return '<div class="card history-item" onclick="loadHistoryReport(\'' + escHtml(rep.filename) + '\')" style="cursor:pointer;transition:border-color 0.2s;" onmouseenter="this.style.borderColor=\'var(--blue)\'" onmouseleave="this.style.borderColor=\'\'">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;">'
        + '<div><strong>' + escHtml(tickers || '市场') + '</strong>'
        + '<span style="color:var(--muted);font-size:0.78rem;margin-left:8px;">' + escHtml(ts) + '</span></div>'
        + '<div style="font-size:0.8rem;">'
        + '<span style="color:var(--muted);">' + rep.steps_completed + '/11部门</span>'
        + '<span style="margin-left:8px;color:' + scoreColor + ';">置信度 ' + avgScore + '</span>'
        + (rep.errors ? '<span style="margin-left:6px;color:var(--red);">' + rep.errors + ' 错</span>' : '')
        + '</div></div>'
        + '<div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">' + escHtml((rep.query || '').substring(0, 100)) + '</div>'
        + '</div>';
    }).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty">历史加载失败</div>';
  }
}

async function loadHistoryReport(filename) {
  try {
    const r = await fetch('/api/research/history/' + encodeURIComponent(filename));
    if (!r.ok) return;
    const data = await r.json();
    document.getElementById('finalReport').style.display = 'block';
    document.getElementById('finalReportContent').innerHTML = escHtml(data.final_report || '报告内容为空');
    if (data.confidence_scores && Object.keys(data.confidence_scores).length > 0) {
      const deptEntries = Object.entries(data.confidence_scores);
      const avgScore = deptEntries.reduce((s, [,v]) => s + v, 0) / deptEntries.length;
      document.getElementById('finalConfidence').textContent =
        '历史研报 · 综合置信度: ' + avgScore.toFixed(1) + '/10 (' + deptEntries.length + '部门)';
    }
    document.getElementById('finalReport').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    console.error('Failed to load history report:', e);
  }
}

// ─── Static Research Data (unchanged) ───

async function fetchData() {
  try {
    const [dxyz, hynix, overview, catalysts] = await Promise.all([
      fetch('/api/research/dxyz').then(r => r.json()).catch(() => null),
      fetch('/api/research/hynix').then(r => r.json()).catch(() => null),
      fetch('/api/research/overview').then(r => r.json()).catch(() => null),
      fetch('/api/research/catalysts').then(r => r.json()).catch(() => null),
    ]);
    renderDXYZ(dxyz);
    renderHynix(hynix);
    renderOverview(overview);
    renderCatalysts(catalysts);
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Fetch error:', e);
  }
}

function renderDXYZ(data) {
  const el = document.getElementById('dxyzSection');
  if (!data || data.error) {
    el.innerHTML = '<div class="empty">DXYZ 数据加载中...</div>';
    return;
  }
  const risks = (data.risks || []).map(r =>
    '<span class="risk-tag risk-' + escHtml(String(r.severity)) + '">' + escHtml(r.label) + '</span>'
  ).join('');
  const catalysts = (data.catalysts || []).map(c =>
    '<div class="news-item"><strong>' + escHtml(c.title) + '</strong><br><span class="news-time">' + escHtml(c.time) + '</span> — ' + escHtml(c.desc) + '</div>'
  ).join('');
  el.innerHTML = `
    <div class="card priority">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div>
          <strong style="font-size:1.1rem;">$${escHtml(String(data.price))}</strong>
          <span class="${data.change_pct >= 0 ? 'up' : 'down'}" style="margin-left:8px;">
            ${data.change_pct >= 0 ? '▲' : '▼'} ${escHtml(String(Math.abs(data.change_pct).toFixed(2)))}%
          </span>
          <span style="color:var(--muted);font-size:0.8rem;margin-left:8px;">今日</span>
        </div>
        <div style="text-align:right;font-size:0.85rem;color:var(--muted);">
          NAV溢价: <strong style="color:var(--yellow);">${escHtml(String(data.nav_premium))}%</strong><br>
          RSI: <strong style="color:${data.rsi > 80 ? 'var(--red)' : 'var(--muted)'};">${escHtml(String(data.rsi))}</strong>
        </div>
      </div>
      <div style="margin-top:8px;">${risks}</div>
      <div class="verdict-box ${escHtml(data.verdict_class || 'verdict-neutral')}">${escHtml(data.verdict || '观望')}</div>
    </div>
    <div class="card">
      <h3>📰 关键催化</h3>
      ${catalysts || '<div class="empty">暂无新催化</div>'}
    </div>
    <div class="card">
      <h3>📝 AI 分析摘要</h3>
      <p style="font-size:0.88rem;color:var(--muted);">${escHtml(data.summary || '加载中...')}</p>
    </div>
  `;
}

function renderHynix(data) {
  const el = document.getElementById('hynixSection');
  if (!data || data.error) {
    el.innerHTML = '<div class="empty">海力士数据加载中...</div>';
    return;
  }
  el.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div>
          <strong style="font-size:1.1rem;">₩${escHtml(String(data.price))}</strong>
          <span class="${data.change_pct >= 0 ? 'up' : 'down'}" style="margin-left:8px;">
            ${data.change_pct >= 0 ? '▲' : '▼'} ${escHtml(String(Math.abs(data.change_pct).toFixed(2)))}%
          </span>
        </div>
        <div style="text-align:right;font-size:0.85rem;color:var(--muted);">
          HBM市占: <strong>${escHtml(String(data.hbm_share))}%</strong><br>
          营业利润率: <strong>${escHtml(String(data.op_margin))}%</strong>
        </div>
      </div>
      <p style="margin-top:8px;font-size:0.88rem;color:var(--muted);">${escHtml(data.summary || '')}</p>
      <div class="verdict-box verdict-bull">${escHtml(data.verdict || '买入 — HBM双寡头格局稳固')}</div>
    </div>
  `;
}

function renderOverview(data) {
  const el = document.getElementById('overviewSection');
  if (!data || !data.stocks) {
    el.innerHTML = '<div class="empty">加载中...</div>';
    return;
  }
  let rows = data.stocks.map(s =>
    '<tr>' +
      '<td>' + escHtml(s.ticker) + '</td>' +
      '<td>$' + escHtml(String(s.price)) + '</td>' +
      '<td class="' + (s.change_pct >=0 ? 'up' : 'down') + '">' + (s.change_pct >=0 ? '+' : '') + escHtml(String(s.change_pct.toFixed(1))) + '%</td>' +
      '<td>' + escHtml(s.signal || '—') + '</td>' +
    '</tr>'
  ).join('');
  el.innerHTML = `
    <div class="card">
      <table>
        <tr><th>标的</th><th>价格</th><th>涨跌</th><th>信号</th></tr>
        ${rows}
      </table>
      <div class="verdict-box verdict-neutral" style="margin-top:10px;">${escHtml(data.focus_note || '')}</div>
    </div>
  `;
}

function renderCatalysts(data) {
  const el = document.getElementById('catalystSection');
  if (!data || !data.events) {
    el.innerHTML = '<div class="empty">加载中...</div>';
    return;
  }
  let items = data.events.map(e =>
    '<tr>' +
      '<td>' + escHtml(e.date) + '</td>' +
      '<td><span class="priority-badge ' + escHtml(e.priority) + '">' + escHtml(String(e.priority).toUpperCase()) + '</span></td>' +
      '<td><strong>' + escHtml(e.title) + '</strong></td>' +
      '<td>' + escHtml(e.tickers.join(', ')) + '</td>' +
    '</tr>'
  ).join('');
  el.innerHTML = `<div class="card"><table>
    <tr><th>日期</th><th>级别</th><th>事件</th><th>关联标的</th></tr>
    ${items}
  </table></div>`;
}

function refreshAll() {
  countdown = 60;
  fetchData();
}

setInterval(() => {
  countdown--;
  document.getElementById('countdown').textContent = countdown + 's';
  if (countdown <= 0) { refreshAll(); }
}, 1000);

// Initialize progress panel on load
initProgressPanel();
fetchData();
loadHistory();
</script>
</body>
</html>
