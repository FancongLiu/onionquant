# OnionQuant — One-command local deployment
#   docker compose up -d              # start all services
#   docker compose up -d server       # dashboard only
#   docker compose logs -f            # tail all logs
#   docker compose down               # stop everything
#
# Dashboard: http://localhost:8765

services:
  # ── FastAPI Dashboard Server ──
  server:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount source dirs for dev hot-reload (drop for prod image)
      - ./onionquant:/app/onionquant:ro
      - ./quant_framework:/app/quant_framework:ro
      - ./infrastructure:/app/infrastructure:ro
      - ./scripts:/app/scripts:ro
      # Env file (copy .env.example → .env first)
      - ./.env:/app/.env:ro
      # Runtime writable data (shared with scheduler)
      - company_data:/app/company
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Background Task Scheduler ──
  scheduler:
    build: .
    command: scheduler
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./onionquant:/app/onionquant:ro
      - ./quant_framework:/app/quant_framework:ro
      - ./infrastructure:/app/infrastructure:ro
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
      - company_data:/app/company
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

