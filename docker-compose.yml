# OnionQuant — Local Development Stack
# $ docker compose up -d
# Server: http://localhost:8765
version: '3.8'

services:
  server:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./company:/app/company
      - ./onionquant:/app/onionquant
      - ./quant_framework:/app/quant_framework
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

