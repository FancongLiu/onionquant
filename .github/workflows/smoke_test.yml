name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          pip install numpy pandas scipy scikit-learn statsmodels matplotlib seaborn pyyaml python-dotenv
          pip install empyrical-reloaded
          pip install fastapi uvicorn aiohttp
          pip install langchain langgraph

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --select E,F,I,N,W,UP --ignore E501

      - name: Run smoke tests
        run: pytest tests/ -q --tb=short --timeout=120

      - name: Generate badge
        if: always()
        run: |
          mkdir -p badges
          if [ "${{ job.status }}" = "success" ]; then
            echo '{"schemaVersion":1,"label":"tests","message":"passing","color":"green"}' > badges/tests.json
          else
            echo '{"schemaVersion":1,"label":"tests","message":"failing","color":"red"}' > badges/tests.json
          fi
