name: Auto-approve agent PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
    - name: Auto-approve agent PRs
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.AGENT_BOT_PAT }}
        script: |
          const pr = context.payload.pull_request;
          if (!pr) {
            console.log('No pull request found in context.');
            return;
          }

          const author = pr.user && pr.user.login;
          const labels = (pr.labels || []).map(l => l.name);

          const allowedAuthors = (process.env.ALLOWED_AUTHORS || '').split(',').map(s => s.trim()).filter(Boolean);
          const allowedLabel = process.env.ALLOWED_LABEL || 'agent';

          const isAllowedAuthor = allowedAuthors.includes(author);
          const hasAllowedLabel = labels.includes(allowedLabel);

          if (!(isAllowedAuthor || hasAllowedLabel)) {
            console.log(`PR #${pr.number} is not from an allowed agent or does not have the '${allowedLabel}' label. Skipping.`);
            return;
          }

          // Approve the PR
          await github.rest.pulls.createReview({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            event: 'APPROVE',
            body: 'Auto-approved by agent workflow'
          });
          console.log(`Approved PR #${pr.number}`);

          // Optional: auto-merge if AGENT_AUTO_MERGE secret is set to 'true'
          if ((process.env.AGENT_AUTO_MERGE || '').toLowerCase() === 'true') {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: process.env.MERGE_METHOD || 'merge'
            });
            console.log(`Merged PR #${pr.number}`);
          }
      env:
        ALLOWED_AUTHORS: ${{ secrets.ALLOWED_AGENT_AUTHORS }}
        ALLOWED_LABEL: agent
        AGENT_AUTO_MERGE: ${{ secrets.AGENT_AUTO_MERGE }}
        MERGE_METHOD: ${{ secrets.AGENT_MERGE_METHOD }}
